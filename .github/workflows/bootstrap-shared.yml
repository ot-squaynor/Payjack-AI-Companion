name: bootstrap-shared

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: Apply the shared Terraform bootstrap stack
        required: true
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'eu-west-2' }}
  PROJECT_NAME: ${{ vars.APP_NAME != '' && vars.APP_NAME || 'payjack-ai-companion' }}
  TF_STATE_BUCKET_NAME: ${{ vars.TF_STATE_BUCKET }}
  TF_LOCK_TABLE_NAME: ${{ vars.TF_LOCK_TABLE }}
  ECR_REPOSITORY_NAME: ${{ vars.ECR_REPOSITORY_NAME != '' && vars.ECR_REPOSITORY_NAME || 'payjack-ai-companion-backend' }}
  SHARED_KB_SOURCE_BUCKET: ${{ vars.SHARED_KB_SOURCE_BUCKET }}
  SHARED_KB_ARTIFACTS_BUCKET: ${{ vars.SHARED_KB_ARTIFACTS_BUCKET }}

jobs:
  bootstrap:
    if: ${{ inputs.apply_changes }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Validate required shared settings
        run: |
          test -n "${TF_STATE_BUCKET_NAME}" || { echo "TF_STATE_BUCKET must be set."; exit 1; }
          test -n "${TF_LOCK_TABLE_NAME}" || { echo "TF_LOCK_TABLE must be set."; exit 1; }

      - name: Resolve shared KB bucket names
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          PROJECT_SLUG="$(echo "${PROJECT_NAME}" | tr '[:upper:]_' '[:lower:]-')"

          if [[ -z "${SHARED_KB_SOURCE_BUCKET}" ]]; then
            SHARED_KB_SOURCE_BUCKET="${PROJECT_SLUG}-${ACCOUNT_ID}-kb-source"
          fi
          if [[ -z "${SHARED_KB_ARTIFACTS_BUCKET}" ]]; then
            SHARED_KB_ARTIFACTS_BUCKET="${PROJECT_SLUG}-${ACCOUNT_ID}-kb-artifacts"
          fi

          echo "TF_VAR_shared_kb_source_bucket_name=${SHARED_KB_SOURCE_BUCKET}" >> "$GITHUB_ENV"
          echo "TF_VAR_shared_kb_artifacts_bucket_name=${SHARED_KB_ARTIFACTS_BUCKET}" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: terraform/bootstrap
        run: |
          STATE_BUCKET_EXISTS=false
          LOCK_TABLE_EXISTS=false
          BOOTSTRAP_STATE_EXISTS=false

          if aws s3api head-bucket --bucket "${TF_STATE_BUCKET_NAME}" >/dev/null 2>&1; then
            STATE_BUCKET_EXISTS=true
          fi
          if aws dynamodb describe-table --table-name "${TF_LOCK_TABLE_NAME}" >/dev/null 2>&1; then
            LOCK_TABLE_EXISTS=true
          fi
          if aws s3api head-object --bucket "${TF_STATE_BUCKET_NAME}" --key "bootstrap/shared/terraform.tfstate" >/dev/null 2>&1; then
            BOOTSTRAP_STATE_EXISTS=true
          fi

          if [[ "${STATE_BUCKET_EXISTS}" != "${LOCK_TABLE_EXISTS}" ]]; then
            echo "Partial bootstrap detected. The Terraform state bucket and lock table must either both exist or both be absent."
            exit 1
          fi

          if [[ "${STATE_BUCKET_EXISTS}" == "true" && "${BOOTSTRAP_STATE_EXISTS}" != "true" ]]; then
            echo "Shared bootstrap resources exist but the remote bootstrap state file is missing."
            echo "Restore or import the bootstrap state before rerunning this workflow."
            exit 1
          fi

          if [[ "${STATE_BUCKET_EXISTS}" == "true" && "${LOCK_TABLE_EXISTS}" == "true" ]]; then
            terraform init \
              -reconfigure \
              -backend-config="bucket=${TF_STATE_BUCKET_NAME}" \
              -backend-config="key=bootstrap/shared/terraform.tfstate" \
              -backend-config="region=${AWS_REGION}" \
              -backend-config="dynamodb_table=${TF_LOCK_TABLE_NAME}"
          else
            terraform init -backend=false -reconfigure
          fi

      - name: Terraform apply
        working-directory: terraform/bootstrap
        env:
          TF_VAR_project_name: ${{ env.PROJECT_NAME }}
          TF_VAR_tf_state_bucket_name: ${{ env.TF_STATE_BUCKET_NAME }}
          TF_VAR_tf_lock_table_name: ${{ env.TF_LOCK_TABLE_NAME }}
          TF_VAR_ecr_repository_name: ${{ env.ECR_REPOSITORY_NAME }}
        run: terraform apply -auto-approve

      - name: Migrate bootstrap state to remote backend
        working-directory: terraform/bootstrap
        run: |
          terraform init \
            -migrate-state \
            -backend-config="bucket=${TF_STATE_BUCKET_NAME}" \
            -backend-config="key=bootstrap/shared/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE_NAME}"

      - name: Terraform apply after backend migration
        working-directory: terraform/bootstrap
        env:
          TF_VAR_project_name: ${{ env.PROJECT_NAME }}
          TF_VAR_tf_state_bucket_name: ${{ env.TF_STATE_BUCKET_NAME }}
          TF_VAR_tf_lock_table_name: ${{ env.TF_LOCK_TABLE_NAME }}
          TF_VAR_ecr_repository_name: ${{ env.ECR_REPOSITORY_NAME }}
        run: terraform apply -auto-approve

      - name: Show bootstrap outputs
        working-directory: terraform/bootstrap
        run: terraform output
