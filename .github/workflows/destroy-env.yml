name: destroy-env

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
      confirmation:
        description: Type destroy-<environment> to confirm
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: destroy-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'eu-west-2' }}
      APP_NAME: ${{ vars.APP_NAME != '' && vars.APP_NAME || 'payjack-ai-companion' }}
      ECR_REPOSITORY_NAME: ${{ vars.ECR_REPOSITORY_NAME != '' && vars.ECR_REPOSITORY_NAME || 'payjack-ai-companion-backend' }}
      SHARED_KB_SOURCE_BUCKET: ${{ vars.SHARED_KB_SOURCE_BUCKET }}
      SHARED_KB_ARTIFACTS_BUCKET: ${{ vars.SHARED_KB_ARTIFACTS_BUCKET }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
      TF_VAR_app_name: ${{ vars.APP_NAME != '' && vars.APP_NAME || 'payjack-ai-companion' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'eu-west-2' }}
      TF_VAR_external_transactions_bucket_name: ${{ vars.EXTERNAL_TRANSACTIONS_BUCKET }}
      TF_VAR_external_transactions_prefix: ${{ vars.EXTERNAL_TRANSACTIONS_PREFIX }}
      TF_VAR_external_accounts_bucket_name: ${{ vars.EXTERNAL_ACCOUNTS_BUCKET }}
      TF_VAR_external_accounts_prefix: ${{ vars.EXTERNAL_ACCOUNTS_PREFIX }}
      TF_VAR_external_fees_bucket_name: ${{ vars.EXTERNAL_FEES_BUCKET }}
      TF_VAR_external_fees_prefix: ${{ vars.EXTERNAL_FEES_PREFIX }}
      TF_VAR_external_products_bucket_name: ${{ vars.EXTERNAL_PRODUCTS_BUCKET }}
      TF_VAR_external_products_prefix: ${{ vars.EXTERNAL_PRODUCTS_PREFIX }}
      TF_VAR_external_metadata_bucket_name: ${{ vars.EXTERNAL_METADATA_BUCKET }}
      TF_VAR_external_metadata_prefix: ${{ vars.EXTERNAL_METADATA_PREFIX }}
      TF_VAR_use_mock_bedrock: ${{ vars.USE_MOCK_BEDROCK != '' && vars.USE_MOCK_BEDROCK || 'false' }}
      TF_VAR_use_local_rag: ${{ vars.USE_LOCAL_RAG != '' && vars.USE_LOCAL_RAG || 'false' }}
      TF_VAR_enable_debug_traces: ${{ vars.ENABLE_DEBUG_TRACES != '' && vars.ENABLE_DEBUG_TRACES || (inputs.environment != 'prod' && 'true' || 'false') }}
      TF_VAR_bedrock_model_id: ${{ vars.BEDROCK_MODEL_ID != '' && vars.BEDROCK_MODEL_ID || 'amazon.nova-micro-v1:0' }}
      TF_VAR_bedrock_embedding_model_id: ${{ vars.BEDROCK_EMBEDDING_MODEL_ID != '' && vars.BEDROCK_EMBEDDING_MODEL_ID || 'amazon.titan-embed-text-v2:0' }}
      TF_VAR_cors_origins: ${{ vars.CORS_ORIGINS != '' && vars.CORS_ORIGINS || 'http://localhost:3000' }}
      TF_VAR_allow_force_destroy: ${{ inputs.environment != 'prod' && 'true' || 'false' }}

    steps:
      - name: Require explicit confirmation
        run: |
          EXPECTED="destroy-${TARGET_ENVIRONMENT}"
          if [[ "${{ inputs.confirmation }}" != "${EXPECTED}" ]]; then
            echo "Confirmation string must match ${EXPECTED}."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve Terraform runtime variables
        run: |
          test -n "${TF_STATE_BUCKET}" || { echo "TF_STATE_BUCKET must be set."; exit 1; }
          test -n "${TF_LOCK_TABLE}" || { echo "TF_LOCK_TABLE must be set."; exit 1; }
          ECR_REPOSITORY_URL="$(aws ecr describe-repositories --repository-names "${ECR_REPOSITORY_NAME}" --query 'repositories[0].repositoryUri' --output text)"
          test -n "${ECR_REPOSITORY_URL}" || { echo "Failed to resolve ECR repository URL."; exit 1; }
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          PROJECT_SLUG="$(echo "${APP_NAME}" | tr '[:upper:]_' '[:lower:]-')"
          if [[ -z "${SHARED_KB_SOURCE_BUCKET}" ]]; then
            SHARED_KB_SOURCE_BUCKET="${PROJECT_SLUG}-${ACCOUNT_ID}-kb-source"
          fi
          if [[ -z "${SHARED_KB_ARTIFACTS_BUCKET}" ]]; then
            SHARED_KB_ARTIFACTS_BUCKET="${PROJECT_SLUG}-${ACCOUNT_ID}-kb-artifacts"
          fi
          echo "TF_VAR_environment=${TARGET_ENVIRONMENT}" >> "$GITHUB_ENV"
          echo "TF_VAR_ecr_repository_url=${ECR_REPOSITORY_URL}" >> "$GITHUB_ENV"
          echo "TF_VAR_image_tag=destroy-${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          echo "TF_VAR_shared_kb_source_bucket_name=${SHARED_KB_SOURCE_BUCKET}" >> "$GITHUB_ENV"
          echo "TF_VAR_shared_kb_artifacts_bucket_name=${SHARED_KB_ARTIFACTS_BUCKET}" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=environments/${TARGET_ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"

      - name: Capture Terraform outputs before destroy
        working-directory: terraform
        run: |
          if terraform output -json > tf-outputs.raw; then
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          raw_path = Path("tf-outputs.raw")
          json_path = Path("tf-outputs.json")
          raw = raw_path.read_text(encoding="utf-8")
          start = raw.find("{")
          if start == -1:
            print(raw, file=sys.stderr)
            raise SystemExit("terraform output did not contain a JSON object; cannot safely determine bucket names. Aborting destroy.")

          payload, _ = json.JSONDecoder().raw_decode(raw[start:])
          json_path.write_text(json.dumps(payload, indent=2, sort_keys=True), encoding="utf-8")
          PY
          else
            echo "terraform output failed; cannot safely determine bucket names. Aborting destroy."
            exit 1
          fi
          jq -e . tf-outputs.json >/dev/null

      - name: Guard external tool pipeline buckets
        run: |
          managed_buckets=(
            "$(jq -r '.processed_artifacts_bucket_name.value // empty' terraform/tf-outputs.json)"
            "$(jq -r '.frontend_bucket_name.value // empty' terraform/tf-outputs.json)"
            "$(jq -r '.kb_source_bucket_name.value // empty' terraform/tf-outputs.json)"
            "$(jq -r '.kb_artifacts_bucket_name.value // empty' terraform/tf-outputs.json)"
          )

          external_buckets=(
            "${TF_VAR_external_transactions_bucket_name}"
            "${TF_VAR_external_accounts_bucket_name}"
            "${TF_VAR_external_fees_bucket_name}"
            "${TF_VAR_external_products_bucket_name}"
            "${TF_VAR_external_metadata_bucket_name}"
          )

          for external_bucket in "${external_buckets[@]}"; do
            if [[ -z "${external_bucket}" ]]; then
              continue
            fi
            for managed_bucket in "${managed_buckets[@]}"; do
              if [[ -n "${managed_bucket}" && "${managed_bucket}" == "${external_bucket}" ]]; then
                echo "Refusing destroy: managed bucket output matches protected external tool pipeline bucket '${external_bucket}'."
                exit 1
              fi
            done
          done

          tf_ext_transactions="$(jq -r '.external_transactions_bucket_name.value // empty' terraform/tf-outputs.json)"
          tf_ext_accounts="$(jq -r '.external_accounts_bucket_name.value // empty' terraform/tf-outputs.json)"

          if [[ -n "${tf_ext_transactions}" && "${tf_ext_transactions}" != "${TF_VAR_external_transactions_bucket_name}" ]]; then
            echo "State drift: Terraform state external_transactions_bucket_name='${tf_ext_transactions}' differs from env var '${TF_VAR_external_transactions_bucket_name}'. Aborting."
            exit 1
          fi
          if [[ -n "${tf_ext_accounts}" && "${tf_ext_accounts}" != "${TF_VAR_external_accounts_bucket_name}" ]]; then
            echo "State drift: Terraform state external_accounts_bucket_name='${tf_ext_accounts}' differs from env var '${TF_VAR_external_accounts_bucket_name}'. Aborting."
            exit 1
          fi

          echo "External tool pipeline buckets are not targeted by this destroy workflow."

      - name: Empty managed and KB buckets for non-prod destroy
        if: ${{ inputs.environment != 'prod' }}
        run: |
          protected_buckets=(
            "${TF_VAR_external_transactions_bucket_name}"
            "${TF_VAR_external_accounts_bucket_name}"
            "${TF_VAR_external_fees_bucket_name}"
            "${TF_VAR_external_products_bucket_name}"
            "${TF_VAR_external_metadata_bucket_name}"
          )

          is_protected_bucket() {
            local bucket="$1"

            for protected_bucket in "${protected_buckets[@]}"; do
              if [[ -n "${protected_bucket}" && "${bucket}" == "${protected_bucket}" ]]; then
                return 0
              fi
            done

            return 1
          }

          require_not_protected_bucket() {
            local bucket="$1"
            local label="$2"

            if [[ -z "${bucket}" ]]; then
              return
            fi

            if is_protected_bucket "${bucket}"; then
              echo "Refusing to empty protected external bucket for ${label}: ${bucket}"
              exit 1
            fi
          }

          empty_s3_prefix_versions() {
            local bucket="$1"
            local prefix="$2"
            local label="$3"

            if [[ -z "${bucket}" ]]; then
              return
            fi

            require_not_protected_bucket "${bucket}" "${label}"

            echo "Emptying ${label}: s3://${bucket}/${prefix}"
            aws s3 rm "s3://${bucket}/${prefix}" --recursive

            while true; do
              versions_json="$(aws s3api list-object-versions \
                --bucket "${bucket}" \
                --prefix "${prefix}" \
                --max-items 1000 \
                --output json)"

              delete_payload="$(echo "${versions_json}" | jq -c '
                {
                  Objects: (((.Versions // []) + (.DeleteMarkers // [])) | map({Key: .Key, VersionId: .VersionId})),
                  Quiet: true
                }
              ')"
              delete_count="$(echo "${delete_payload}" | jq '.Objects | length')"

              if [[ "${delete_count}" -eq 0 ]]; then
                break
              fi

              echo "Deleting ${delete_count} versioned object(s) from ${label}."
              aws s3api delete-objects \
                --bucket "${bucket}" \
                --delete "${delete_payload}" >/dev/null
            done
          }

          managed_buckets=(
            "$(jq -r '.processed_artifacts_bucket_name.value // empty' terraform/tf-outputs.json)"
            "$(jq -r '.frontend_bucket_name.value // empty' terraform/tf-outputs.json)"
          )

          for bucket in "${managed_buckets[@]}"; do
            if [[ -n "${bucket}" ]]; then
              require_not_protected_bucket "${bucket}" "managed environment bucket"
              echo "Emptying managed environment bucket: ${bucket}"
              aws s3 rm "s3://${bucket}" --recursive || true
            fi
          done

          kb_source_bucket="$(jq -r '.kb_source_bucket_name.value // empty' terraform/tf-outputs.json)"
          kb_artifacts_bucket="$(jq -r '.kb_artifacts_bucket_name.value // empty' terraform/tf-outputs.json)"

          if [[ -n "${kb_source_bucket}" ]]; then
            empty_s3_prefix_versions "${kb_source_bucket}" "raw_docs/" "KB source raw docs prefix"
          fi

          if [[ -n "${kb_artifacts_bucket}" ]]; then
            empty_s3_prefix_versions "${kb_artifacts_bucket}" "${TARGET_ENVIRONMENT}/" "KB artifacts environment prefix"
          fi

      - name: Terraform destroy
        working-directory: terraform
        run: terraform destroy -auto-approve
