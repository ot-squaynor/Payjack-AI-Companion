name: plan-env

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - "terraform/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan
        required: true
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    concurrency:
      group: plan-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    env:
      TARGET_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
      AWS_REGION: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'us-east-1' }}
      APP_NAME: ${{ vars.APP_NAME != '' && vars.APP_NAME || 'payjack-ai-companion' }}
      ECR_REPOSITORY_NAME: ${{ vars.ECR_REPOSITORY_NAME != '' && vars.ECR_REPOSITORY_NAME || 'payjack-ai-companion-backend' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
      TF_VAR_app_name: ${{ vars.APP_NAME != '' && vars.APP_NAME || 'payjack-ai-companion' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_vpc_id: ${{ vars.VPC_ID }}
      TF_VAR_alb_subnet_ids: ${{ vars.ALB_SUBNET_IDS }}
      TF_VAR_ecs_subnet_ids: ${{ vars.ECS_SUBNET_IDS }}
      TF_VAR_alb_ingress_cidr_blocks: ${{ vars.ALB_INGRESS_CIDR_BLOCKS != '' && vars.ALB_INGRESS_CIDR_BLOCKS || '["0.0.0.0/0"]' }}
      TF_VAR_external_transactions_bucket_name: ${{ vars.EXTERNAL_TRANSACTIONS_BUCKET }}
      TF_VAR_external_transactions_prefix: ${{ vars.EXTERNAL_TRANSACTIONS_PREFIX }}
      TF_VAR_external_accounts_bucket_name: ${{ vars.EXTERNAL_ACCOUNTS_BUCKET }}
      TF_VAR_external_accounts_prefix: ${{ vars.EXTERNAL_ACCOUNTS_PREFIX }}
      TF_VAR_external_fees_bucket_name: ${{ vars.EXTERNAL_FEES_BUCKET }}
      TF_VAR_external_fees_prefix: ${{ vars.EXTERNAL_FEES_PREFIX }}
      TF_VAR_external_products_bucket_name: ${{ vars.EXTERNAL_PRODUCTS_BUCKET }}
      TF_VAR_external_products_prefix: ${{ vars.EXTERNAL_PRODUCTS_PREFIX }}
      TF_VAR_external_metadata_bucket_name: ${{ vars.EXTERNAL_METADATA_BUCKET }}
      TF_VAR_external_metadata_prefix: ${{ vars.EXTERNAL_METADATA_PREFIX }}
      TF_VAR_use_mock_bedrock: ${{ vars.USE_MOCK_BEDROCK != '' && vars.USE_MOCK_BEDROCK || 'true' }}
      TF_VAR_use_local_rag: ${{ vars.USE_LOCAL_RAG != '' && vars.USE_LOCAL_RAG || 'false' }}
      TF_VAR_enable_debug_traces: ${{ vars.ENABLE_DEBUG_TRACES != '' && vars.ENABLE_DEBUG_TRACES || 'true' }}
      TF_VAR_bedrock_model_id: ${{ vars.BEDROCK_MODEL_ID != '' && vars.BEDROCK_MODEL_ID || 'anthropic.claude-3-5-haiku-20241022-v1:0' }}
      TF_VAR_bedrock_embedding_model_id: ${{ vars.BEDROCK_EMBEDDING_MODEL_ID != '' && vars.BEDROCK_EMBEDDING_MODEL_ID || 'amazon.titan-embed-text-v2:0' }}
      TF_VAR_cors_origins: ${{ vars.CORS_ORIGINS != '' && vars.CORS_ORIGINS || 'http://localhost:3000' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Resolve image and Terraform runtime variables
        run: |
          test -n "${TF_STATE_BUCKET}" || { echo "TF_STATE_BUCKET must be set."; exit 1; }
          test -n "${TF_LOCK_TABLE}" || { echo "TF_LOCK_TABLE must be set."; exit 1; }
          ECR_REPOSITORY_URL="$(aws ecr describe-repositories --repository-names "${ECR_REPOSITORY_NAME}" --query 'repositories[0].repositoryUri' --output text)"
          test -n "${ECR_REPOSITORY_URL}" || { echo "Failed to resolve ECR repository URL."; exit 1; }
          echo "TF_VAR_environment=${TARGET_ENVIRONMENT}" >> "$GITHUB_ENV"
          echo "TF_VAR_ecr_repository_url=${ECR_REPOSITORY_URL}" >> "$GITHUB_ENV"
          echo "TF_VAR_image_tag=plan-${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          echo "TF_VAR_allow_force_destroy=false" >> "$GITHUB_ENV"

      - name: Validate external buckets
        run: |
          check_bucket() {
            local label="$1"
            local bucket="$2"
            if [[ -z "${bucket}" ]]; then
              echo "Skipping ${label}; no bucket configured."
              return
            fi
            echo "Validating ${label}: ${bucket}"
            aws s3api head-bucket --bucket "${bucket}"
          }

          check_bucket "transactions bucket" "${TF_VAR_external_transactions_bucket_name}"
          check_bucket "accounts bucket" "${TF_VAR_external_accounts_bucket_name}"
          check_bucket "fees bucket" "${TF_VAR_external_fees_bucket_name}"
          check_bucket "products bucket" "${TF_VAR_external_products_bucket_name}"
          check_bucket "metadata bucket" "${TF_VAR_external_metadata_bucket_name}"

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=environments/${TARGET_ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Render plan text
        working-directory: terraform
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ env.TARGET_ENVIRONMENT }}
          path: terraform/tfplan.txt
